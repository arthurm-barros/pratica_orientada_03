{% extends 'base.html' %}

{% block title %}
    Livros cadastrados
{% endblock %}

<!-- Passar lista de livros -->

{% block content %}
    <a href="{{ url_for('new_book') }}">Cadastrar livro</a>
    <h1>Livros</h1>
    <section class="livros">
        {% for livro in livros %}
        <div class="livro">
            <h4>{{ livro.titulo }}</h4>
            <p>Usuário: {{ livro.usuario.nome }}</p>
        </div>
        {% else %}
            <span>Não há livros cadastrados</span>
        {% endfor %}
    </section>
{% endblock %}
